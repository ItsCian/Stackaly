# CI: checks every pull request and every push to main.
# Two independent jobs (backend + frontend) run in parallel.
# Both must pass before a PR can be merged (branch ruleset on main).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run still in progress:
# no point finishing checks on a commit that is already outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always # coloured cargo output in the Actions logs

jobs:
  # ── Backend: Rust (Axum + SeaORM) ───────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend # every `run:` starts in backend/

    # Throwaway PostgreSQL for the integration tests, same as `db-test`
    # in docker-compose.yml. It is deleted when the job ends.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci # not a secret: this DB only lives for one run
          POSTGRES_DB: stackaly_test
        ports:
          - 5433:5432 # same host port as db-test locally
        # GitHub waits until this health check passes before running the steps,
        # so the tests never hit a database that is still starting.
        options: >-
          --health-cmd "pg_isready -U admin -d stackaly_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # Read by the tests in api/tests/ (see the `app()` helper)
      TEST_DATABASE_URL: postgres://admin:ci@localhost:5433/stackaly_test

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and backend/target, keyed on Cargo.lock.
      # Turns a ~2 min cold compile into a few seconds on later runs.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --check

      # --all-targets: also lints tests/, not just src/
      # -D warnings:   any warning fails the job (otherwise Clippy never fails)
      # --locked:      fail if Cargo.lock is out of date instead of silently updating it
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Runs the migration crate's own CLI (same as `sea-orm-cli migrate up`),
      # so we don't have to install sea-orm-cli on the runner.
      - name: Apply migrations to the test database
        run: cargo run -p migration --locked -- up -u "$TEST_DATABASE_URL"

      - name: Tests
        run: cargo test --workspace --locked

  # ── Frontend: React + Vite + Bun ───────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Bun's global package cache, keyed on the lockfile
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile: fail if bun.lock doesn't match package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `biome ci` = `biome check` made for CI: read-only, never writes fixes,
      # fails on any formatting or lint error.
      - name: Lint and format check (Biome)
        run: bunx biome ci .

      # The build script runs: Paraglide compile → tsc -b (type-check) → vite build
      - name: Type-check and build
        run: bun run build

      - name: Tests
        run: bun run test
